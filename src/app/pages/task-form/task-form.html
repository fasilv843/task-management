<div class="mx-auto max-w-3xl px-6 py-10">
  <header class="mb-8 border-b border-rule pb-6">
    <h1 class="text-[28px] font-semibold leading-tight text-ink">{{ pageTitle() }}</h1>
  </header>

  @if (isLoadingTask()) {
    <div aria-busy="true" aria-label="Loading task">
      <div class="task-skeleton h-4 w-24 bg-rule"></div>
      <div class="task-skeleton mt-3 h-10 w-full bg-rule"></div>
      <div class="task-skeleton mt-8 h-4 w-32 bg-rule"></div>
      <div class="task-skeleton mt-3 h-40 w-full bg-rule"></div>
      <div class="task-skeleton mt-8 h-4 w-20 bg-rule"></div>
      <div class="task-skeleton mt-3 h-10 w-full bg-rule"></div>
    </div>
  } @else if (loadError()) {
    <app-error-state message="Couldn't load this task." (retry)="taskResource.reload()" />
  } @else if (isTaskMissing()) {
    <div class="border border-dashed border-rule px-6 py-14 text-center" role="alert">
      <p class="font-medium text-ink">We couldn't find that task.</p>
      <p class="mt-1 text-sm text-ink-soft">It may have been deleted.</p>
      <button
        type="button"
        class="mt-4 cursor-pointer border border-ink bg-ink px-4 py-2 text-sm font-medium text-paper transition-colors hover:bg-paper hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        (click)="onCancel()"
      >
        Back to tasks
      </button>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" appFocusFirstInvalid novalidate>
      <app-common-input
        class="mb-8"
        fieldId="task-title"
        label="Title"
        formControlName="title"
        autocomplete="off"
        placeholder="Enter Title"
      />

      <app-rich-text-editor
        class="mb-8"
        fieldId="task-description"
        label="Description"
        formControlName="description"
        placeholder="Describe the task…"
      />

      <app-common-date-input
        class="mb-8"
        fieldId="task-deadline"
        label="Deadline"
        formControlName="deadline"
        [min]="minDeadline()"
      />

      <app-common-select
        class="mb-8"
        fieldId="task-status"
        label="Status"
        [options]="statusOptions"
        formControlName="status"
      />

      @if (saveError()) {
        <div
          class="mb-6 border border-danger-ink bg-danger-bg px-4 py-3 text-sm text-ink"
          role="alert"
        >
          {{ saveError() }}
        </div>
      }

      <div class="flex flex-wrap items-center gap-3 border-t border-rule pt-6">
        <button
          type="submit"
          class="cursor-pointer border border-ink bg-ink px-4 py-2 text-sm font-medium text-paper transition-colors hover:bg-paper hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="isSaving()"
        >
          {{ isSaving() ? 'Saving…' : submitLabel() }}
        </button>

        <button
          type="button"
          class="cursor-pointer border border-rule px-4 py-2 text-sm font-medium text-ink transition-colors hover:border-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          (click)="onCancel()"
        >
          Cancel
        </button>
      </div>
    </form>
  }
</div>
