<ul
  class="mb-6 flex flex-wrap gap-5 font-mono text-xs text-ink-soft"
  aria-label="Status colours"
>
  @for (entry of legend; track entry.status) {
    <li class="inline-flex items-center gap-1.5">
      <span
        class="h-2.5 w-2.5 border"
        [style.background-color]="entry.colors.background"
        [style.border-color]="entry.colors.border"
        aria-hidden="true"
      ></span>

      {{ statusLabels[entry.status] }}
    </li>
  }
</ul>

<!-- The skeleton stands in for the first load only. A reload keeps the calendar
     on screen, because tearing it down would destroy and rebuild it — losing
     the view the user picked and the month they had paged to. -->
@if (tasksResource.isLoading() && !tasksResource.hasValue()) {
  <div aria-label="Loading calendar" aria-busy="true">
    <div class="skeleton-loader h-9 w-full bg-rule"></div>
    <div class="skeleton-loader mt-3 h-[30rem] w-full bg-rule"></div>
  </div>
} @else if (tasksResource.error()) {
  <app-error-state
    message="Couldn't load your tasks."
    (retry)="tasksResource.reload()"
  />
} @else {
  <app-common-calendar
    [events]="calendarEvents()"
    [attr.aria-busy]="tasksResource.isLoading()"
    (eventSelect)="openTask($event)"
  />
}
