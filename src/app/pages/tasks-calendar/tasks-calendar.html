<div class="mx-auto max-w-3xl px-6 py-10">
  <header class="mb-8 border-b border-rule pb-6">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <h1 class="text-[28px] font-semibold leading-tight text-ink">Tasks</h1>

      <div class="flex flex-wrap items-center gap-4">
        <app-common-tab
          [tabs]="viewTabs"
          active="calendar"
          ariaLabel="Task views"
          (tabSelect)="switchView($event)"
        />
        <app-common-button class="shrink-0" label="New task" (buttonClick)="addTask()" />
      </div>
    </div>

    <ul
      class="mt-6 flex flex-wrap gap-5 font-mono text-xs text-ink-soft"
      aria-label="Status colours"
    >
      @for (entry of legend; track entry.status) {
        <li class="inline-flex items-center gap-1.5">
          <span
            class="h-2.5 w-2.5 border"
            [style.background-color]="entry.colors.background"
            [style.border-color]="entry.colors.border"
            aria-hidden="true"
          ></span>
          {{ statusLabels[entry.status] }}
        </li>
      }
    </ul>
  </header>

  @if (tasksResource.isLoading()) {
    <div aria-label="Loading calendar" aria-busy="true">
      <div class="task-skeleton h-9 w-full bg-rule"></div>
      <div class="task-skeleton mt-3 h-[30rem] w-full bg-rule"></div>
    </div>
  } @else if (tasksResource.error()) {
    <app-error-state message="Couldn't load your tasks." (retry)="tasksResource.reload()" />
  } @else {
    <app-task-calendar [tasks]="tasksResource.value() ?? []" (taskSelect)="openTask($event)" />
  }
</div>
