<button
  #button
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-expanded]="ariaExpanded() ?? null"
  [attr.aria-controls]="ariaControls() ?? null"
  [class]="classes()"
  (click)="onClick($event)"
>
  <ng-content select="[icon]" />
  @if (label()) {
    <span>{{ label() }}</span>
  }
</button>
