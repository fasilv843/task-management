@if (renderedHtml()) {
  <div
    #clip
    [id]="contentId"
    class="rich-text-content"
    [class.rich-text-content--clipped]="!isExpanded()"
  >
    <div #body [innerHTML]="renderedHtml()"></div>

    @if (!isExpanded() && isOverflowing()) {
      <div class="rich-text-content__fade" aria-hidden="true"></div>
    }
  </div>

  @if (isOverflowing()) {
    <app-common-button
      class="mt-1.5 text-sm"
      variant="link"
      [label]="toggleLabel()"
      [ariaLabel]="toggleAccessibleName()"
      [ariaExpanded]="isExpanded()"
      [ariaControls]="contentId"
      (buttonClick)="toggle()"
    />
  }
}
