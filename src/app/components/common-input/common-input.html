<app-form-field
  [label]="label()"
  [labelFor]="fieldId()"
  [labelHidden]="labelHidden()"
  [hint]="hint()"
  [hintId]="hintId()"
  [errorId]="errorId()"
  [message]="message()"
>
  @if (isTextarea()) {
    <textarea
      #control
      [id]="fieldId()"
      [rows]="rows()"
      [value]="value() ?? ''"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      class="common-input__control"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="onTouched()"
    ></textarea>
  } @else {
    <input
      #control
      [id]="fieldId()"
      [type]="type()"
      [value]="value() ?? ''"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      class="common-input__control"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />
  }
</app-form-field>
